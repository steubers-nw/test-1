[server]
host = 0.0.0.0
port = 18186

[upstream]
url = https://vybe.build
timeout = 180

# ---- 故障转移策略 ----
# 402/429 后该 cookie 冷却多少秒（额度耗尽 / 限流）
cookie_cooldown = 300
# 连续失败（5xx / 网络）几次后熔断
cookie_max_fails = 3
# 熔断后冷却多少秒
cookie_fail_cooldown = 60

# ---- 多 Cookie 池 ----
# 每个 [cookie:xxx] 段 = 一个账户，必须成对提供 session_token + agent_id
# 名称 xxx 只用于日志和 /healthz 展示

[cookie:main]
session_token = 替换成__Secure-better-auth.session_token的值
agent_id = cmw1y9zec000grv02yj332d39
enabled = true

# 想要更多账户就继续加 [cookie:xxx] 段
# [cookie:backup1]
# session_token = ...
# agent_id = ...
# enabled = true

# [cookie:backup2]
# session_token = ...
# agent_id = ...
# enabled = true

[log]
to_file = false
file = proxy.log
