# vetta_proxy 配置 —— 改完重启 run.bat 生效。所有值不要加引号。
# 上游：https://api.vetta.sh/v1/proxy/openai/v1/chat/completions

[proxy]
# 监听地址：0.0.0.0 = 本机 + 局域网都能连；只想本机用就写 127.0.0.1
host = 0.0.0.0
port = 8327
# 本服务自己的访问密钥；留空 = 不校验（本地自用建议留空）
api_key =
# 允许的最大请求体(MB)
max_body_mb = 32

[upstream]
url = https://api.vetta.sh/v1/proxy/openai/v1/chat/completions

# ---- 密钥池 ----
# 多个密钥用英文逗号分隔，按顺序优先使用（换行写也行）。环境变量 VETTA_API_KEY 优先级最高。
# 例：keys = sk_live_aaa, sk_live_bbb, sk_live_ccc
keys = sk_live_xxx

# 同一把 key 失败时先重试几次（1 = 首次失败再试 1 次，共 2 次），仍然失败才换下一把 key。
retries_per_key = 1
# 重试前的等待（毫秒），只对 429 / 5xx / 网络错误生效
retry_backoff_ms = 400
# 判定「这把 key 不能用」（401/403）并重试仍失败时：
#   true  = 从上面的 keys 里摘掉，写进文件末尾的 [disabled] 段，方便人工确认
#   false = 只在内存里跳过，不改配置文件
auto_disable = true
# 把归一后的挡位塞进 Vetta-Effort 头（上游文档没列这个头、实测无效，纯粹为将来兼容）
send_effort_header = true
# 单次上游请求超时（秒）
timeout = 600

[models]
# 客户端不传 model 时用哪个
default_model = google/gemini-4-argon
# 客户端传了不认识的模型时：true = 回落 default_model；false = 原样透传（让上游报 unknown model）
map_unknown_to_default = false

# /v1/models 里列出的名字（短名，客户端下拉框就显这几项）
# 真实上游 id 也能直接用，只是不进清单
list_models =
    3.5fl
    3.5f
    3.6f
    3.7f
    3.8f
    4a
    4.5o
    4.6o
    4.7o
    4.8o
    5o
    5.5o

# 短名 -> 上游真实模型 id
# Gemini：3.5-flash(lite) ~ 4-argon
alias.3.5fl = google/gemini-3.5-flash-lite
alias.3.5f  = google/gemini-3.5-flash
alias.3.6f  = google/gemini-3.6-flash
alias.3.7f  = google/gemini-3.7-flash
alias.3.8f  = google/gemini-3.8-flash
alias.4a    = google/gemini-4-argon
# Claude Opus：4.5 ~ 5.5
alias.4.5o  = anthropic/claude-opus-4.5
alias.4.6o  = anthropic/claude-opus-4.6
alias.4.7o  = anthropic/claude-opus-4.7
alias.4.8o  = anthropic/claude-opus-4.8
alias.5o    = anthropic/claude-opus-5
alias.5.5o  = anthropic/claude-opus-5.5

[thinking]
# 默认思考挡位：客户端完全没传挡位时用这个（low / medium / high，留空 = 不处理）
default_effort = high

# 上游 proxy 没有 effort 接口：effort / reasoning_effort / output_config / thinking
# 四种传法实测都被 400 unknown body field 拒掉，SDK 文档的 ProxyMessageCreate 里也没有这些字段。
# 所以「挡位」只能这样落地：
#   strip = 剥掉客户端的挡位参数，不影响模型（最安全）
#   model = 用挡位换成对应模型（下面 model_low/medium/high），这是唯一看得见效果的用法
mode = strip

# mode = model 时生效。留空则该挡位不换模型，沿用它原本指定的模型。
model_low  =
model_medium = anthropic/claude-opus-4.6
model_high = anthropic/claude-opus-5.5

[logging]
dir = logs
# 一行一请求的 access.jsonl（结构化汇总，排查主力）
access_jsonl = true
# 每个请求的完整请求体 / 响应体，落 logs/bodies/<时间>-<rid>.json
# 里面是对话原文，介意就别开
log_bodies = true
bodies_dir = logs/bodies
# 控制台打印 http.server 的原始日志
verbose = false

[disabled]
# 自动摘除的密钥：key = 摘除时间 + 原因。
# 充值或换新 key 后，把对应行删掉、并把 key 加回上面的 keys =，重启即可恢复。
